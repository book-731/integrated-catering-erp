name: ERP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # 只供無資料庫的型別／單元測試配置；整合測試 URL 在下方動態產生。
      DATABASE_URL: postgresql://unused@127.0.0.1:55432/restaurant_erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Start isolated PostgreSQL with ephemeral credentials
        shell: bash
        run: |
          ci_database_password=$(openssl rand -hex 24)
          echo "::add-mask::$ci_database_password"
          export POSTGRES_PASSWORD="$ci_database_password"
          printf 'TEST_DATABASE_URL=postgresql://erp_test:%s@127.0.0.1:55433/restaurant_erp_test\n' "$ci_database_password" >> "$GITHUB_ENV"
          docker run --detach --rm --name erp-ci-postgres \
            --publish 127.0.0.1:55433:5432 \
            --env POSTGRES_USER=erp_test --env POSTGRES_PASSWORD \
            --env POSTGRES_DB=restaurant_erp_test \
            --health-cmd "pg_isready -U erp_test -d restaurant_erp_test" \
            --health-interval 2s --health-timeout 3s --health-retries 30 \
            postgres:17-bookworm
          for attempt in {1..45}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' erp-ci-postgres)" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          echo 'PostgreSQL readiness timed out.'
          exit 1
      - run: npm run check
      - run: npm run test:integration
      - name: Stop isolated PostgreSQL
        if: always()
        run: docker stop erp-ci-postgres || true

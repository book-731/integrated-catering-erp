name: nkust-team12-erp

x-api: &api
  image: nkust-team12-erp-api:local
  build:
    context: .
    dockerfile: apps/backend/Dockerfile
  environment:
    NODE_ENV: production
    API_HOST: 0.0.0.0
    API_PORT: 3000
    CORS_ORIGIN: http://localhost:8080
    APP_ORIGIN: http://localhost:8080
    # 此 compose 僅供 loopback HTTP 開發；HTTPS 部署需設為 true。
    SESSION_COOKIE_SECURE: 'false'
    TRUST_PROXY_HOPS: 1
    DATABASE_URL: postgresql://${POSTGRES_USER:?Run npm run setup:env}:${POSTGRES_PASSWORD:?Run npm run setup:env}@postgres:5432/${POSTGRES_DB:?Run npm run setup:env}?schema=public

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run setup:env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:env}
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run setup:env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres-test:
    image: postgres:17-bookworm
    profiles: ['test']
    environment:
      POSTGRES_USER: erp_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:env}
      POSTGRES_DB: restaurant_erp_test
    ports:
      - '127.0.0.1:55433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp_test -d restaurant_erp_test']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *api
    profiles: ['app']
    command: ['npm', 'run', 'db:deploy']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *api
    profiles: ['app']
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
